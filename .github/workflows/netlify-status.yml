name: Netlify Deployment Status

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Wait for Netlify Deploy
      uses: jsmrcaga/action-netlify-deploy@v2.4.0
      with:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        build_command: "npm run build"
        build_directory: "./dist"
      continue-on-error: true
    
    - name: Check deployment health
      run: |
        echo "Checking deployment health..."
        # Add health check for your production URL
        curl -f https://national1031center.com || echo "Site may still be deploying"
      continue-on-error: true
    
    - name: Lighthouse Performance Check
      uses: treosh/lighthouse-ci-action@v11
      with:
        urls: https://national1031center.com
        uploadArtifacts: true
        temporaryPublicStorage: true
        runs: 1
      continue-on-error: true